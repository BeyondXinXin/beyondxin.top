name: Deploy Main Site

on:
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH for private submodules
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GH_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."git@github.com:".insteadOf "https://github.com/"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update submodules to latest remote commit
        run: |
          git submodule update --init --remote --recursive
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.22"
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
      - name: Build beyondxin
        run: |
          cd site-beyondxin
          pnpm install --frozen-lockfile
          pnpm build
      - name: Upload beyondxin
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "site-beyondxin/dist/*"
          target: "/home/www/html/beyondxin.com"
          strip_components: 2
          overwrite: true
